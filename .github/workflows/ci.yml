name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # イベントデータの CLI（Python。Node は使わない）
      - uses: astral-sh/setup-uv@v6
      - run: uv run python -m unittest discover -s tools/tests
      - run: uv run caimawaru check
      - run: uv run caimawaru import example --dry-run
      # リポジトリに入っている circles.json が、イベントデータから作り直したものと同じこと
      - if: runner.os == 'Linux'
        run: |
          uv run caimawaru data example
          git diff --exit-code -- events/example/public

      # ページ（Node。Python は使わない）
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build example
      - run: pnpm build:editor
